; --- Ray-traced shadows test (M_STATION, 2026-11-14) -------------------------------
; Hardware RT shadows ONLY. Lumen GI and reflections stay OFF above on purpose: GI feeding
; the cel band is what PR #41 removed, and MI_AnimeLook's band is a 12%-wide smoothstep on
; Lum(sceneColor)/Lum(baseColor), so a denoised GI term flips whole surfaces between tones.
; RT shadows are the opposite: hard-edged and temporally stable, which is what the band wants.
; r.RayTracing and r.SkinCache.CompileShaders are ECVF_ReadOnly startup settings - changing
; them needs an editor restart and one RT hit-shader compile.
; r.SkinCache.CompileShaders is NOT optional. Its engine default is 0 (GPUSkinCache.cpp:94) and
; RenderUtils.cpp:1045 is a *Fatal*: "Ray tracing requires skin cache to be enabled." RT on with
; the skin cache at 0 crashes the editor on startup.
r.RayTracing=True
r.SkinCache.CompileShaders=1
; This one is runtime-settable (ECVF_RenderThreadSafe, LightRendering.cpp:84, default 0), so the
; A/B is a console command, not a restart:  r.RayTracing.Shadows 0  vs  r.RayTracing.Shadows 1
; Per-light-type gate r.RayTracing.Shadows.Lights.Directional already defaults to 1, and the sun's
; CastRaytracedShadow is left at UseProjectSetting, so no .umap edit and no LFS lock is needed.
r.RayTracing.Shadows=1
; ---------------------------------------------------------------------------------

; --- Shadow reach on the NON-ray-traced path (M_STATION, 2026-11-14) ---------------
; This does NOT belong on the sun actor, and that is the trap. While r.Shadow.Virtual.Enable=1,
; the directional light's DynamicShadowDistanceMovableLight is INERT: VSM does not use cascade
; distance fading at all (DirectionalLightComponent.cpp:510-516 returns early), and the clipmap's
; reach comes from the level cvars, not the light - GetLevelRadius(L) = 2^(L+1) cm
; (VirtualShadowMapClipmap.cpp:176). The stock LastLevel of 22 is a ~84 km shadow clipmap thrown
; over a ~150 m level that is built from 325 deliberately non-Nanite actors, which is what feeds
; the "[VSM] Non-Nanite Marking Job Queue overflow" banner. 14 gives 2^15 cm = 328 m radius,
; still far larger than the level, and drops the clipmap from 17 levels to 9.
; Runtime-settable (ECVF_Scalability|ECVF_RenderThreadSafe), so it A/Bs from the console:
;   r.Shadow.Virtual.Clipmap.LastLevel 22   vs   r.Shadow.Virtual.Clipmap.LastLevel 14
r.Shadow.Virtual.Clipmap.LastLevel=14
; ---------------------------------------------------------------------------------

